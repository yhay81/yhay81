name: Refresh profile data

on:
  schedule:
    # Daily at 09:17 JST (00:17 UTC); :17 avoids the busiest top-of-hour window.
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: profile-writes
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    name: Refresh first-party signals and latest writing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # Required only for the final, bot-authenticated profile commit.

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Update GitHub signals and latest Zenn writing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_profile.py --strict

      - name: Validate generated profile
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v

      - name: Commit when profile data changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- README.md github-metrics.svg
          if git diff --cached --quiet; then
            echo "Profile data is already current."
            exit 0
          fi

          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh public signals"
          gh auth setup-git
          git push
