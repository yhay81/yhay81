name: Validate profile repository

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python 3.14
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Compile and test
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v

      - name: Install hash-locked Ruff, ty, and zizmor
        run: |
          wheels=$(mktemp -d)
          # Allow these exact releases early. Both are seven days old by November 18 at 13:54 UTC.
          if [[ $(date -u +%Y-%m-%dT%H:%MZ) < 2026-11-18T13:54Z ]]; then
            python -m pip download --disable-pip-version-check --no-deps --only-binary :all: \
              --dest "$wheels" ruff==0.17.4 ty==0.0.101
          fi
          python -m pip install --disable-pip-version-check --no-deps --only-binary :all: \
            --find-links "$wheels" --require-hashes --uploaded-prior-to P7D -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check --output-format=github scripts tests

      - name: Verify Ruff formatting
        run: ruff format --check --output-format=github scripts tests

      - name: Audit GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona pedantic --format github .
