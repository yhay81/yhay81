<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Yusuke Hayashi — engineering systems that ship</title>
  <desc id="desc">A luminous engineering console showing production AI, Python, Rust, TypeScript, and a frame-to-operate delivery loop.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FBFF"/>
      <stop offset=".58" stop-color="#F5F3FF"/>
      <stop offset="1" stop-color="#FFF7FB"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891B2"/>
      <stop offset=".48" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".88"/>
      <stop offset="1" stop-color="#F2F5FF" stop-opacity=".8"/>
    </linearGradient>
    <radialGradient id="cyan-glow">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".2"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-glow">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".2"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#314866" stroke-opacity=".07"/>
    </pattern>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="960" height="360" rx="24"/>
    </clipPath>
    <style>
      .flow { animation: flow 5s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .blink { animation: blink 1.1s step-end infinite; }
      @keyframes flow { to { stroke-dashoffset: -88; } }
      @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.86); } 50% { opacity: 1; transform: scale(1.12); } }
      @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .flow, .pulse, .blink { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="960" height="360" fill="url(#background)"/>
    <ellipse cx="82" cy="54" rx="330" ry="250" fill="url(#cyan-glow)"/>
    <ellipse cx="890" cy="260" rx="360" ry="280" fill="url(#violet-glow)"/>
    <rect width="960" height="360" fill="url(#grid)"/>
    <path d="M-20 318C176 264 306 372 490 307S758 258 990 314" fill="none" stroke="#7C3AED" stroke-opacity=".045" stroke-width="70"/>
  </g>
  <rect x=".75" y=".75" width="958.5" height="358.5" rx="23.25" fill="none" stroke="#263D5A" stroke-opacity=".18" stroke-width="1.5"/>

  <g font-family="'Cascadia Code', Consolas, monospace">
    <g transform="translate(48 35)">
      <circle cx="5" cy="5" r="4" fill="#059669" filter="url(#soft-glow)" class="pulse"/>
      <text x="19" y="9" fill="#0E7490" font-size="11" font-weight="700" letter-spacing="1.25">YH://ENGINEERING.SYSTEM</text>
      <rect x="230" y="-5" width="72" height="20" rx="10" fill="#059669" fill-opacity=".08" stroke="#059669" stroke-opacity=".42"/>
      <text x="266" y="9" text-anchor="middle" fill="#047857" font-size="9" font-weight="700" letter-spacing="1">● ONLINE</text>
    </g>
    <text x="912" y="44" text-anchor="end" fill="#64748B" font-size="10" letter-spacing="1.15">TOKYO / UTC+09</text>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="48" y="91" fill="#52637D" font-family="'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.7">SOFTWARE ENGINEER × PRODUCT BUILDER</text>
    <text x="46" y="147" fill="url(#spectrum)" font-size="50" font-weight="800" letter-spacing="-1.8">SYSTEMS</text>
    <text x="46" y="200" fill="#111827" font-size="50" font-weight="800" letter-spacing="-1.8">THAT SHIP.</text>
    <text x="49" y="230" fill="#52637D" font-size="14" font-weight="500" letter-spacing=".35">Production AI · durable tooling · cloud delivery</text>
  </g>

  <g transform="translate(48 252)" font-family="'Cascadia Code', Consolas, monospace" font-size="9" font-weight="700" letter-spacing=".7">
    <g>
      <rect width="74" height="25" rx="6" fill="#0891B2" fill-opacity=".07" stroke="#0891B2" stroke-opacity=".38"/>
      <text x="37" y="16.5" text-anchor="middle" fill="#0E7490">PYTHON</text>
    </g>
    <g transform="translate(84)">
      <rect width="61" height="25" rx="6" fill="#EA580C" fill-opacity=".07" stroke="#EA580C" stroke-opacity=".36"/>
      <text x="30.5" y="16.5" text-anchor="middle" fill="#C2410C">RUST</text>
    </g>
    <g transform="translate(155)">
      <rect width="94" height="25" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-opacity=".36"/>
      <text x="47" y="16.5" text-anchor="middle" fill="#1D4ED8">TYPESCRIPT</text>
    </g>
    <g transform="translate(259)">
      <rect width="78" height="25" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-opacity=".36"/>
      <text x="39" y="16.5" text-anchor="middle" fill="#6D28D9">LLM/RAG</text>
    </g>
    <g transform="translate(347)">
      <rect width="76" height="25" rx="6" fill="#DB2777" fill-opacity=".07" stroke="#DB2777" stroke-opacity=".36"/>
      <text x="38" y="16.5" text-anchor="middle" fill="#BE185D">CI/CD</text>
    </g>
  </g>

  <g transform="translate(608 69)">
    <rect width="304" height="214" rx="15" fill="url(#panel)" stroke="#4A5E7D" stroke-opacity=".22"/>
    <path d="M0 38H304" stroke="#52637D" stroke-opacity=".13"/>
    <circle cx="19" cy="19" r="4" fill="#F43F5E"/>
    <circle cx="34" cy="19" r="4" fill="#F59E0B"/>
    <circle cx="49" cy="19" r="4" fill="#10B981"/>
    <text x="152" y="23" text-anchor="middle" fill="#6B7B93" font-family="'Cascadia Code', Consolas, monospace" font-size="9" letter-spacing="1.1">PROFILE.SYS</text>

    <g transform="translate(22 59)" font-family="'Cascadia Code', Consolas, monospace" font-size="11">
      <text fill="#0E7490">$ profile --inspect</text>
      <g transform="translate(0 26)">
        <text fill="#718096">role</text>
        <text x="74" fill="#1F2937">engineer / builder</text>
      </g>
      <g transform="translate(0 48)">
        <text fill="#718096">focus</text>
        <text x="74" fill="#1F2937">production AI</text>
      </g>
      <g transform="translate(0 70)">
        <text fill="#718096">method</text>
        <text x="74" fill="#1F2937">design → ship → operate</text>
      </g>
      <g transform="translate(0 92)">
        <text fill="#718096">mode</text>
        <text x="74" fill="#047857">shipping</text>
        <rect x="127" y="-10" width="6" height="13" rx="1" fill="#059669" class="blink"/>
      </g>
    </g>

    <g transform="translate(22 170)">
      <path d="M0 18H260" stroke="#64748B" stroke-opacity=".18"/>
      <path d="M0 22L24 22L38 13L55 19L77 7L95 15L119 11L139 18L160 4L181 13L204 8L228 16L260 5" fill="none" stroke="url(#spectrum)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flow" stroke-dasharray="7 4"/>
      <circle cx="260" cy="5" r="3.5" fill="#DB2777" filter="url(#soft-glow)" class="pulse"/>
      <text y="39" fill="#66758C" font-family="'Cascadia Code', Consolas, monospace" font-size="8" letter-spacing="1">BUILD SIGNAL / HEALTHY</text>
    </g>
  </g>

  <g transform="translate(48 318)" font-family="'Cascadia Code', Consolas, monospace">
    <path d="M5 5H864" stroke="#64748B" stroke-opacity=".28" stroke-width="2"/>
    <path d="M5 5H864" stroke="url(#spectrum)" stroke-width="2" stroke-linecap="round" stroke-dasharray="34 14" class="flow"/>
    <g fill="#F7FAFF" stroke-width="2.5">
      <circle cx="5" cy="5" r="5" stroke="#0891B2"/>
      <circle cx="220" cy="5" r="5" stroke="#2563EB"/>
      <circle cx="434" cy="5" r="5" stroke="#7C3AED"/>
      <circle cx="649" cy="5" r="5" stroke="#9333EA"/>
      <circle cx="864" cy="5" r="5" stroke="#DB2777"/>
    </g>
    <g fill="#63718A" font-size="9" font-weight="700" letter-spacing="1">
      <text x="0" y="25">FRAME</text>
      <text x="220" y="25" text-anchor="middle">MODEL</text>
      <text x="434" y="25" text-anchor="middle">BUILD</text>
      <text x="649" y="25" text-anchor="middle">EVALUATE</text>
      <text x="864" y="25" text-anchor="end">OPERATE</text>
    </g>
  </g>
</svg>
