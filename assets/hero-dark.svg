<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Yusuke Hayashi — reliable software, practical AI</title>
  <desc id="desc">Editorial profile banner with a delivery pipeline from discover to operate.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D8E6E3" stroke-opacity=".055"/>
    </pattern>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset=".55" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect width="960" height="300" rx="22" fill="#0B1115"/>
  <rect x=".75" y=".75" width="958.5" height="298.5" rx="21.25" fill="none" stroke="#CFE6E2" stroke-opacity=".2" stroke-width="1.5"/>
  <rect x="1" y="1" width="958" height="298" rx="21" fill="url(#grid)"/>

  <g font-family="'Segoe UI', Arial, sans-serif" fill="#EDF7F5">
    <rect x="48" y="38" width="9" height="9" rx="2" fill="#2DD4BF"/>
    <text x="68" y="47" font-family="'Cascadia Code', Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.2">YUSUKE HAYASHI / HAYA INC.</text>
    <text x="912" y="47" text-anchor="end" font-family="'Cascadia Code', Consolas, monospace" font-size="11" letter-spacing="1" fill="#9AB2AE">TOKYO · UTC+09</text>

    <text x="48" y="112" font-size="38" font-weight="720" letter-spacing="-.8">RELIABLE SOFTWARE.</text>
    <text x="48" y="158" font-size="38" font-weight="720" letter-spacing="-.8">SHIPPED WELL.</text>
    <text x="50" y="190" font-size="15" font-weight="500" letter-spacing=".6" fill="#9AB2AE">PRACTICAL AI · DURABLE SYSTEMS · PRODUCTION DELIVERY</text>

    <text x="912" y="110" text-anchor="end" font-size="76" font-weight="760" letter-spacing="-6" fill="#EDF7F5" opacity=".065">YH</text>
  </g>

  <g transform="translate(48 228)" font-family="'Cascadia Code', Consolas, monospace">
    <path d="M7 7H829" fill="none" stroke="#344743" stroke-width="2"/>
    <path d="M7 7H829" fill="none" stroke="url(#signal)" stroke-width="2" stroke-dasharray="126 36 126 36 126 36 126 36 126" opacity=".95"/>
    <g fill="#0B1115" stroke-width="3">
      <circle cx="7" cy="7" r="6" stroke="#2DD4BF"/>
      <circle cx="279" cy="7" r="6" stroke="#38BDF8"/>
      <circle cx="557" cy="7" r="6" stroke="#60A5FA"/>
      <circle cx="829" cy="7" r="6" stroke="#A78BFA"/>
    </g>
    <g fill="#9AB2AE" font-size="11" font-weight="600" letter-spacing="1">
      <text x="0" y="34">DISCOVER</text>
      <text x="272" y="34">DESIGN</text>
      <text x="550" y="34">SHIP</text>
      <text x="822" y="34" text-anchor="end">OPERATE</text>
    </g>
  </g>
</svg>
