<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Yusuke Hayashi — engineering systems that ship</title>
  <desc id="desc">A luminous engineering console showing production AI, Python, Rust, TypeScript, and a frame-to-operate delivery loop.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset=".58" stop-color="#091426"/>
      <stop offset="1" stop-color="#07111D"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6EE7F9"/>
      <stop offset=".48" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15213B" stop-opacity=".82"/>
      <stop offset="1" stop-color="#09111F" stop-opacity=".68"/>
    </linearGradient>
    <radialGradient id="cyan-glow">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".24"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-glow">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".25"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#D9F5FF" stroke-opacity=".045"/>
    </pattern>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="960" height="360" rx="24"/>
    </clipPath>
    <style>
      .flow { animation: flow 5s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .blink { animation: blink 1.1s step-end infinite; }
      @keyframes flow { to { stroke-dashoffset: -88; } }
      @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.86); } 50% { opacity: 1; transform: scale(1.12); } }
      @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .flow, .pulse, .blink { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="960" height="360" fill="url(#background)"/>
    <ellipse cx="82" cy="54" rx="330" ry="250" fill="url(#cyan-glow)"/>
    <ellipse cx="890" cy="260" rx="360" ry="280" fill="url(#violet-glow)"/>
    <rect width="960" height="360" fill="url(#grid)"/>
    <path d="M-20 318C176 264 306 372 490 307S758 258 990 314" fill="none" stroke="#67E8F9" stroke-opacity=".055" stroke-width="70"/>
  </g>
  <rect x=".75" y=".75" width="958.5" height="358.5" rx="23.25" fill="none" stroke="#C6F5FF" stroke-opacity=".2" stroke-width="1.5"/>

  <g font-family="'Cascadia Code', Consolas, monospace">
    <g transform="translate(48 35)">
      <circle cx="5" cy="5" r="4" fill="#34D399" filter="url(#soft-glow)" class="pulse"/>
      <text x="19" y="9" fill="#9EEAF5" font-size="11" font-weight="700" letter-spacing="1.25">YH://ENGINEERING.SYSTEM</text>
      <rect x="230" y="-5" width="72" height="20" rx="10" fill="#34D399" fill-opacity=".1" stroke="#34D399" stroke-opacity=".45"/>
      <text x="266" y="9" text-anchor="middle" fill="#6EE7B7" font-size="9" font-weight="700" letter-spacing="1">● ONLINE</text>
    </g>
    <text x="912" y="44" text-anchor="end" fill="#8395AF" font-size="10" letter-spacing="1.15">TOKYO / UTC+09</text>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="48" y="91" fill="#8FA4C4" font-family="'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.7">SOFTWARE ENGINEER × PRODUCT BUILDER</text>
    <text x="46" y="147" fill="url(#spectrum)" font-size="50" font-weight="800" letter-spacing="-1.8">SYSTEMS</text>
    <text x="46" y="200" fill="#F4F8FF" font-size="50" font-weight="800" letter-spacing="-1.8">THAT SHIP.</text>
    <text x="49" y="230" fill="#A5B6D0" font-size="14" font-weight="500" letter-spacing=".35">Production AI · durable tooling · cloud delivery</text>
  </g>

  <g transform="translate(48 252)" font-family="'Cascadia Code', Consolas, monospace" font-size="9" font-weight="700" letter-spacing=".7">
    <g>
      <rect width="74" height="25" rx="6" fill="#22D3EE" fill-opacity=".1" stroke="#22D3EE" stroke-opacity=".42"/>
      <text x="37" y="16.5" text-anchor="middle" fill="#8BE9F7">PYTHON</text>
    </g>
    <g transform="translate(84)">
      <rect width="61" height="25" rx="6" fill="#F97316" fill-opacity=".1" stroke="#FB923C" stroke-opacity=".42"/>
      <text x="30.5" y="16.5" text-anchor="middle" fill="#FDBA74">RUST</text>
    </g>
    <g transform="translate(155)">
      <rect width="94" height="25" rx="6" fill="#3B82F6" fill-opacity=".1" stroke="#60A5FA" stroke-opacity=".42"/>
      <text x="47" y="16.5" text-anchor="middle" fill="#93C5FD">TYPESCRIPT</text>
    </g>
    <g transform="translate(259)">
      <rect width="78" height="25" rx="6" fill="#A855F7" fill-opacity=".1" stroke="#C084FC" stroke-opacity=".42"/>
      <text x="39" y="16.5" text-anchor="middle" fill="#D8B4FE">LLM/RAG</text>
    </g>
    <g transform="translate(347)">
      <rect width="76" height="25" rx="6" fill="#EC4899" fill-opacity=".1" stroke="#F472B6" stroke-opacity=".42"/>
      <text x="38" y="16.5" text-anchor="middle" fill="#F9A8D4">CI/CD</text>
    </g>
  </g>

  <g transform="translate(608 69)">
    <rect width="304" height="214" rx="15" fill="url(#panel)" stroke="#B4D8FF" stroke-opacity=".22"/>
    <path d="M0 38H304" stroke="#C9E5FF" stroke-opacity=".12"/>
    <circle cx="19" cy="19" r="4" fill="#FB7185"/>
    <circle cx="34" cy="19" r="4" fill="#FBBF24"/>
    <circle cx="49" cy="19" r="4" fill="#34D399"/>
    <text x="152" y="23" text-anchor="middle" fill="#7488A6" font-family="'Cascadia Code', Consolas, monospace" font-size="9" letter-spacing="1.1">PROFILE.SYS</text>

    <g transform="translate(22 59)" font-family="'Cascadia Code', Consolas, monospace" font-size="11">
      <text fill="#67E8F9">$ profile --inspect</text>
      <g transform="translate(0 26)">
        <text fill="#7386A5">role</text>
        <text x="74" fill="#F1F5FF">engineer / builder</text>
      </g>
      <g transform="translate(0 48)">
        <text fill="#7386A5">focus</text>
        <text x="74" fill="#F1F5FF">production AI</text>
      </g>
      <g transform="translate(0 70)">
        <text fill="#7386A5">method</text>
        <text x="74" fill="#F1F5FF">design → ship → operate</text>
      </g>
      <g transform="translate(0 92)">
        <text fill="#7386A5">mode</text>
        <text x="74" fill="#6EE7B7">shipping</text>
        <rect x="127" y="-10" width="6" height="13" rx="1" fill="#6EE7B7" class="blink"/>
      </g>
    </g>

    <g transform="translate(22 170)">
      <path d="M0 18H260" stroke="#6E7D98" stroke-opacity=".18"/>
      <path d="M0 22L24 22L38 13L55 19L77 7L95 15L119 11L139 18L160 4L181 13L204 8L228 16L260 5" fill="none" stroke="url(#spectrum)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flow" stroke-dasharray="7 4"/>
      <circle cx="260" cy="5" r="3.5" fill="#F472B6" filter="url(#soft-glow)" class="pulse"/>
      <text y="39" fill="#657994" font-family="'Cascadia Code', Consolas, monospace" font-size="8" letter-spacing="1">BUILD SIGNAL / HEALTHY</text>
    </g>
  </g>

  <g transform="translate(48 318)" font-family="'Cascadia Code', Consolas, monospace">
    <path d="M5 5H864" stroke="#63748D" stroke-opacity=".28" stroke-width="2"/>
    <path d="M5 5H864" stroke="url(#spectrum)" stroke-width="2" stroke-linecap="round" stroke-dasharray="34 14" class="flow"/>
    <g fill="#07101E" stroke-width="2.5">
      <circle cx="5" cy="5" r="5" stroke="#67E8F9"/>
      <circle cx="220" cy="5" r="5" stroke="#60A5FA"/>
      <circle cx="434" cy="5" r="5" stroke="#A78BFA"/>
      <circle cx="649" cy="5" r="5" stroke="#C084FC"/>
      <circle cx="864" cy="5" r="5" stroke="#F472B6"/>
    </g>
    <g fill="#7F91AB" font-size="9" font-weight="700" letter-spacing="1">
      <text x="0" y="25">FRAME</text>
      <text x="220" y="25" text-anchor="middle">MODEL</text>
      <text x="434" y="25" text-anchor="middle">BUILD</text>
      <text x="649" y="25" text-anchor="middle">EVALUATE</text>
      <text x="864" y="25" text-anchor="end">OPERATE</text>
    </g>
  </g>
</svg>
