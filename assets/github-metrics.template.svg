<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Yusuke Hayashi — integrated GitHub engineering metrics</title>
  <desc id="desc">Public GitHub snapshot: $public_repositories repositories, $stars stars, $forks forks, $followers followers, and a language distribution led by $leading_language.</desc>
  <!-- Generated by scripts/update_profile.py from GitHub's versioned REST API. -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset=".5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="var(--grid)" stroke-opacity=".08"/>
    </pattern>
    <clipPath id="language-bar-clip"><rect width="536" height="16" rx="8"/></clipPath>
    <style>
      :root {
        --bg: #F8FAFC;
        --panel: #FFFFFF;
        --text: #172033;
        --muted: #667085;
        --line: #D7DDEA;
        --grid: #52637D;
        --cyan: #0891B2;
        --violet: #7C3AED;
        --pink: #DB2777;
        --orange: #EA580C;
        --green: #059669;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #070B16;
          --panel: #101827;
          --text: #F3F6FF;
          --muted: #93A4BF;
          --line: #27344D;
          --grid: #D7E8FF;
          --cyan: #67E8F9;
          --violet: #A78BFA;
          --pink: #F472B6;
          --orange: #FDBA74;
          --green: #6EE7B7;
        }
      }
      .label { font: 700 10px "Cascadia Code", Consolas, monospace; letter-spacing: 1.2px; fill: var(--muted); }
      .value { font: 800 30px "Segoe UI", Arial, sans-serif; fill: var(--text); }
      .caption { font: 500 11px "Segoe UI", Arial, sans-serif; fill: var(--muted); }
      .mono { font: 600 11px "Cascadia Code", Consolas, monospace; fill: var(--text); }
    </style>
  </defs>

  <rect width="960" height="360" rx="20" fill="var(--bg)"/>
  <rect width="960" height="360" rx="20" fill="url(#grid)"/>
  <rect x=".75" y=".75" width="958.5" height="358.5" rx="19.25" fill="none" stroke="var(--line)" stroke-width="1.5"/>
  <rect x="32" y="28" width="5" height="26" rx="2.5" fill="url(#accent)"/>
  <text x="51" y="42" class="label">ENGINEERING FOOTPRINT / PUBLIC GITHUB</text>
  <text x="51" y="59" class="caption">Signal over spectacle · generated from first-party repository data</text>
  <text x="928" y="42" text-anchor="end" class="label">AUTOMATED</text>
  <text x="928" y="59" text-anchor="end" class="caption">weekly refresh</text>

  <g transform="translate(32 85)">
    <g>
      <rect width="208" height="83" rx="12" fill="var(--panel)" stroke="var(--line)"/>
      <text x="17" y="24" class="label">PUBLIC REPOSITORIES</text>
      <text x="17" y="61" class="value">$public_repositories</text>
      <circle cx="181" cy="51" r="14" fill="none" stroke="var(--cyan)" stroke-opacity=".3" stroke-width="7"/>
      <path d="M181 37A14 14 0 0 1 194 56" fill="none" stroke="var(--cyan)" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g transform="translate(224)">
      <rect width="208" height="83" rx="12" fill="var(--panel)" stroke="var(--line)"/>
      <text x="17" y="24" class="label">STARS EARNED</text>
      <text x="17" y="61" class="value">$stars</text>
      <path d="M181 35L186 45L197 47L189 55L191 67L181 62L171 67L173 55L165 47L176 45Z" fill="var(--violet)" fill-opacity=".2" stroke="var(--violet)"/>
    </g>
    <g transform="translate(448)">
      <rect width="208" height="83" rx="12" fill="var(--panel)" stroke="var(--line)"/>
      <text x="17" y="24" class="label">FORKS</text>
      <text x="17" y="61" class="value">$forks</text>
      <path d="M174 39V58M190 39V49C190 55 186 58 181 58H174M169 34A5 5 0 1 1 169 44A5 5 0 0 1 169 34ZM195 34A5 5 0 1 1 195 44A5 5 0 0 1 195 34ZM174 55A5 5 0 1 1 174 65A5 5 0 0 1 174 55Z" fill="none" stroke="var(--pink)" stroke-width="2"/>
    </g>
    <g transform="translate(672)">
      <rect width="224" height="83" rx="12" fill="var(--panel)" stroke="var(--line)"/>
      <text x="17" y="24" class="label">FOLLOWERS</text>
      <text x="17" y="61" class="value">$followers</text>
      <circle cx="191" cy="43" r="8" fill="none" stroke="var(--orange)" stroke-width="2"/>
      <path d="M177 67C179 56 203 56 205 67" fill="none" stroke="var(--orange)" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <g transform="translate(32 188)">
    <rect width="572" height="140" rx="13" fill="var(--panel)" stroke="var(--line)"/>
    <text x="18" y="26" class="label">PRIMARY LANGUAGE SIGNAL</text>
    $language_legend

    <g transform="translate(18 69)">
      <rect width="536" height="16" rx="8" fill="var(--line)"/>
      <g clip-path="url(#language-bar-clip)">
        $language_segments
      </g>
    </g>

    <text x="18" y="111" class="caption">Top primary languages across original public repositories + Other</text>
    <text x="554" y="111" text-anchor="end" class="label">$language_counts</text>
    <path d="M18 124H554" stroke="var(--line)"/>
  </g>

  <g transform="translate(620 188)">
    <rect width="308" height="140" rx="13" fill="var(--panel)" stroke="var(--line)"/>
    <text x="18" y="26" class="label">ENGINEERING RANGE</text>
    <g transform="translate(18 45)">
      <circle cx="5" cy="5" r="4" fill="var(--cyan)"/>
      <text x="19" y="9" class="mono">AI systems &amp; evaluation</text>
      <circle cx="5" cy="31" r="4" fill="var(--violet)"/>
      <text x="19" y="35" class="mono">Python / Rust tooling</text>
      <circle cx="5" cy="57" r="4" fill="var(--pink)"/>
      <text x="19" y="61" class="mono">Web APIs &amp; automation</text>
      <circle cx="5" cy="83" r="4" fill="var(--orange)"/>
      <text x="19" y="87" class="mono">Cloud delivery &amp; ops</text>
    </g>
  </g>
</svg>
